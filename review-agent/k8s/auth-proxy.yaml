apiVersion: apps/v1
kind: Deployment
metadata:
  name: oauth2-proxy
  namespace: review-agent-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oauth2-proxy
  template:
    metadata:
      labels:
        app: oauth2-proxy
    spec:
      containers:
      - args:
        - --provider=github
        - --email-domain=* # Allow any email for now, restrict later if needed
        - --upstream=http://pr-review-ui:80/ # Default upstream (the UI)
        - --upstream=http://pr-review-api:80/api/ # API path upstream
        - --http-address=0.0.0.0:4180
        - --cookie-secure=false 
        # Standard oauth2-proxy env vars for client ID, secret, cookie secret
        envFrom:
        - secretRef:
            name: oauth2-proxy-creds
        image: quay.io/oauth2-proxy/oauth2-proxy:v7.5.1
        name: oauth2-proxy
        ports:
        - containerPort: 4180
          name: http
---
apiVersion: v1
kind: Service
metadata:
  name: oauth2-proxy
  namespace: review-agent-system
spec:
  ports:
  - name: http
    port: 80
    targetPort: 4180
  selector:
    app: oauth2-proxy